<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixellence - Particle Aquarium</title>
    <link rel="icon" type="image/svg+xml" href="/pixelbox/assets/favicon-BjBwciEx.svg">
    <link rel="icon" type="image/x-icon" href="/pixelbox/assets/favicon-C52D-SD9.ico">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available; /* Safari fix for viewport height */
        }
        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            box-sizing: border-box;
            overflow: hidden;
            min-height: 0; /* Important: allows flex child to shrink below content size */
            padding: 5px; /* Small padding to ensure canvas doesn't touch edges */
        }
        #game-container canvas {
            max-width: 100%;
            max-height: 100%;
            width: auto !important;
            height: auto !important;
            object-fit: contain;
        }
        #element-selector {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px;
            border-radius: 3px;
            backdrop-filter: blur(5px);
            z-index: 1000;
            max-width: 100vw;
            justify-content: center;
            align-self: center;
            margin: 3px;
            margin-bottom: max(3px, env(safe-area-inset-bottom)); /* Account for iOS home indicator */
            padding-bottom: calc(2px + env(safe-area-inset-bottom)); /* Extra padding for safe area */
        }

        /* Separator styling - default (horizontal layout) */
        .element-separator {
            width: 2px;
            height: 32px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 1px;
            flex-shrink: 0;
        }

        /* Mobile Portrait: Multi-row layout */
        @media (max-width: 768px) and (orientation: portrait) {
            #element-selector {
                max-width: 95vw;
            }
            .element-separator {
                display: none; /* Hide separators on mobile portrait - they break layout when wrapping */
            }
        }

        /* Mobile Landscape: Side panel layout */
        @media (max-width: 900px) and (orientation: landscape) {
            body {
                display: flex;
                flex-direction: column;
            }
            #game-header {
                height: 26px;
                font-size: 10px;
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
            }
            #game-header .hdr-btn { width: 20px; height: 20px; font-size: 11px; }
            #game-container {
                flex: 1;
                height: auto;
                width: calc(100vw - 44px); /* Leave space for 32px buttons + 12px margins */
                min-height: 0;
            }
            #element-selector {
                position: fixed;
                right: 3px;
                top: 50%;
                transform: translateY(-50%);
                flex-direction: column;
                max-width: 44px;
                max-height: 95vh;
                overflow-y: auto;
                margin-bottom: 0;
            }

            /* Rotate separators for vertical layout */
            .element-separator {
                width: 32px;
                height: 2px;
                margin: 2px 0;
            }
        }
        .element-btn {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            touch-action: manipulation;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .element-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .element-btn:active {
            transform: translateY(0px) scale(0.95);
        }
        .element-btn.active {
            border-width: 2px;
            border-color: #00ffff;  /* Bright cyan */
            box-shadow:
                0 0 15px rgba(0, 255, 255, 0.9),  /* Strong outer glow */
                0 0 8px rgba(0, 255, 255, 0.6),  /* Medium glow */
                inset 0 0 8px rgba(0, 255, 255, 0.4);  /* Inner glow */
            transform: scale(1.05);
            position: relative;
            z-index: 10;  /* Bring active button to front */
        }
        /* Lock overlay for premium elements */
        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
            pointer-events: none;
            z-index: 5;
        }
        .element-btn.premium-element:not(.locked) .lock-overlay {
            display: none;
        }
        .element-btn.locked {
            opacity: 0.7;
            filter: grayscale(40%);
        }
        .keybind {
            position: absolute;
            bottom: 1px;
            right: 1px;
            font-size: 7px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            padding: 1px 2px;
            border-radius: 2px;
            line-height: 1;
            pointer-events: none;
            text-shadow: none;
        }
        #global-tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.85);
            color: rgba(255, 255, 255, 0.9);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 10px;
            pointer-events: none;
            z-index: 10000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            min-width: 100px;
            max-width: 200px;
        }
        #tooltip-name {
            font-weight: 600;
            margin-bottom: 3px;
            font-size: 10px;
            color: rgba(0, 255, 255, 0.8);
            text-transform: uppercase;
        }
        #tooltip-props {
            color: rgba(255, 255, 255, 0.7);
            font-size: 9px;
            margin-bottom: 3px;
            line-height: 1.3;
            white-space: pre-line;
        }
        #tooltip-key {
            color: rgba(255, 200, 100, 0.8);
            font-size: 8px;
            font-weight: 500;
            padding-top: 3px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* ── Game Header Bar ── */
        #game-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 32px;
            padding: 0 10px;
            padding-top: env(safe-area-inset-top, 0px);
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            z-index: 500;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-header .header-left,
        #game-header .header-center,
        #game-header .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #game-header .header-left { flex: 1; justify-content: flex-start; }
        #game-header .header-center { flex: 0 0 auto; }
        #game-header .header-right { flex: 1; justify-content: flex-end; }
        #game-header .hdr-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(218, 165, 32, 0.35);
            color: rgba(255, 255, 255, 0.8);
            width: 22px;
            height: 22px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            padding: 0;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, border-color 0.15s;
            touch-action: manipulation;
        }
        #game-header .hdr-btn:active {
            background: rgba(218, 165, 32, 0.25);
            border-color: rgba(218, 165, 32, 0.7);
        }
        #game-header #season-display {
            font-size: 11px;
            letter-spacing: 0.5px;
            color: rgba(255, 220, 120, 0.9);
        }
        #game-header #speed-display {
            font-size: 10px;
            min-width: 36px;
            text-align: center;
            color: rgba(0, 255, 255, 0.85);
        }

        /* ── Settings Modal ── */
        #settings-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            animation: fadeIn 0.25s ease;
        }
        #settings-modal {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            border: 2px solid rgba(218, 165, 32, 0.5);
            border-radius: 4px;
            padding: 20px 24px;
            max-width: 320px;
            width: 85%;
            box-shadow: 0 0 24px rgba(218, 165, 32, 0.15), inset 0 0 12px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.25s ease;
            position: relative;
            font-family: 'Courier New', monospace;
        }
        #settings-modal h3 {
            margin: 0 0 16px 0;
            text-align: center;
            color: rgba(218, 165, 32, 0.9);
            font-size: 14px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(218, 165, 32, 0.3);
            padding-bottom: 10px;
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
        }
        .settings-row:last-child { border-bottom: none; }
        .settings-row label { flex: 1; cursor: pointer; }
        .settings-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(218, 165, 32, 0.3);
            color: rgba(255, 255, 255, 0.8);
            padding: 4px 12px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
        }
        .settings-toggle:active,
        .settings-toggle.active {
            background: rgba(218, 165, 32, 0.2);
            border-color: rgba(218, 165, 32, 0.6);
            color: rgba(218, 165, 32, 0.95);
        }
        #settings-close {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(218, 165, 32, 0.4);
            width: 24px; height: 24px;
            color: rgba(218, 165, 32, 0.8);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .settings-version {
            text-align: center;
            font-size: 8px;
            opacity: 0.35;
            margin-top: 12px;
        }

        /* ── Stats (minimal, hidden by default) ── */
        #stats {
            position: fixed;
            top: calc(36px + env(safe-area-inset-top, 0px));
            right: 8px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.25);
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-family: monospace;
            backdrop-filter: blur(3px);
            display: none;
            z-index: 499;
        }
        #stats.visible { display: block; }
        #profiler-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.9);
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            min-width: 320px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #0f0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        #profiler-panel h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #0ff;
            border-bottom: 1px solid #0f0;
            padding-bottom: 4px;
        }
        #profiler-panel .metric {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
            padding: 2px 4px;
            background: rgba(0, 255, 0, 0.05);
        }
        #profiler-panel .metric.warn {
            color: #ff0;
            background: rgba(255, 255, 0, 0.1);
        }
        #profiler-panel .metric.critical {
            color: #f00;
            background: rgba(255, 0, 0, 0.1);
        }
        #profiler-panel .metric-name {
            flex: 1;
        }
        #profiler-panel .metric-value {
            font-weight: bold;
            text-align: right;
        }
        #profiler-panel .section {
            margin-top: 10px;
        }
        #profiler-panel kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }

        /* Menu System */
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #menu-modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #menu-modal h2 {
            margin: 0 0 24px 0;
            font-size: 28px;
            color: #00ffff;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        #main-menu, #template-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1) 0%, rgba(0, 255, 255, 0.05) 100%);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
        }

        .menu-btn:hover {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(0, 255, 255, 0.1) 100%);
            border-color: rgba(0, 255, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 255, 255, 0.3);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .menu-icon {
            font-size: 32px;
            flex-shrink: 0;
        }

        .menu-btn-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .menu-btn-desc {
            font-size: 13px;
            opacity: 0.7;
        }

        .menu-btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Template Grid */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .template-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .template-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-color: rgba(0, 255, 255, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 255, 255, 0.2);
        }

        .template-btn:active {
            transform: translateY(-2px);
        }

        .template-icon {
            font-size: 48px;
        }

        .template-name {
            font-size: 14px;
            font-weight: bold;
        }

        .template-desc {
            font-size: 11px;
            opacity: 0.6;
            line-height: 1.3;
        }

        /* Responsive adjustments for menu */
        @media (max-width: 600px) {
            #menu-modal {
                padding: 24px;
                width: 95%;
            }

            .template-grid {
                grid-template-columns: 1fr 1fr;
            }

            .template-icon {
                font-size: 36px;
            }

            .template-name {
                font-size: 12px;
            }

            .template-desc {
                font-size: 10px;
            }
        }

        /* Grimoire Modal */
        #grimoire-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            animation: fadeIn 0.3s ease;
        }

        #grimoire-modal {
            background: #000000;
            border: 3px solid #00ff00;
            border-radius: 0;
            padding: 24px;
            max-width: 800px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5), inset 0 0 10px rgba(0, 255, 0, 0.1);
            animation: slideUp 0.3s ease;
            position: relative;
            font-family: 'Courier New', monospace;
        }

        .grimoire-element {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .grimoire-element:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        @media (max-width: 600px) {
            #grimoire-modal {
                padding: 16px 12px;
            }

            #grimoire-content {
                font-size: 11px;
            }
        }

    </style>
</head>
<body>
    <!-- ── Header Bar ── -->
    <div id="game-header">
        <div class="header-left">
            <span id="season-display">🌸 Spring</span>
        </div>
        <div class="header-center">
            <button id="speed-down" class="hdr-btn" title="Slower">−</button>
            <span id="speed-display">⏱️ 1x</span>
            <button id="speed-up" class="hdr-btn" title="Faster">+</button>
        </div>
        <div class="header-right">
            <button id="settings-btn" class="hdr-btn" title="Menu" style="font-size:13px;">☰</button>
        </div>
    </div>

    <div id="game-container"></div>

    <div id="brush-control" style="
        display: none;
        width: 100%;
        z-index: 100;
        background: rgba(0,0,0,0.6);
        padding: 4px 12px;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: monospace;
        color: #aaa;
        font-size: 11px;
    ">
        <button id="brush-down" class="hdr-btn" style="width:28px;height:28px;font-size:14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:4px;">−</button>
        <canvas id="brush-preview" width="40" height="40" style="border-radius:4px;"></canvas>
        <span id="brush-size-label" style="min-width:20px;text-align:center;color:#00cccc;font-weight:bold;">1x</span>
        <button id="brush-up" class="hdr-btn" style="width:28px;height:28px;font-size:14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:4px;">+</button>
    </div>

    <div id="element-selector">
        <!-- Will be populated dynamically by JavaScript -->
    </div>

    <div id="global-tooltip" style="display: none;">
        <div id="tooltip-name"></div>
        <div id="tooltip-props"></div>
        <div id="tooltip-key"></div>
    </div>

    <!-- Minimal stats overlay (hidden by default, toggled from settings) -->
    <div id="stats">
        <span>FPS: <span id="fps">60</span></span> &nbsp;
        <span>P: <span id="particles">0</span></span>
    </div>

    <!-- Hidden elements that JS still references -->
    <span id="mode-display" style="display:none;">🔨 Build</span>
    <span id="version" style="display:none;">-</span>

    <!-- Settings Modal -->
    <div id="settings-overlay" style="display: none;">
        <div id="settings-modal">
            <button id="settings-close">×</button>
            <h3>⚙ SETTINGS</h3>
            <div class="settings-row">
                <label>🔊 Sound</label>
                <button id="mute-btn" class="settings-toggle active" title="Toggle Sound">
                    <span id="mute-icon">ON</span>
                </button>
            </div>
            <div class="settings-row">
                <label>🔨 Build Mode</label>
                <button id="build-toggle" class="settings-toggle active">ON</button>
            </div>
            <div class="settings-row">
                <label>📊 FPS Counter</label>
                <button id="fps-toggle" class="settings-toggle">OFF</button>
            </div>
            <div class="settings-row">
                <label>📖 Element Guide</label>
                <button id="grimoire-btn" class="settings-toggle">OPEN</button>
            </div>
            <div class="settings-version">v<span id="settings-version">-</span></div>
        </div>
    </div>

    <div id="profiler-panel" style="display: none;">

                <div style="text-align: center; font-size: 16px; letter-spacing: 2px;">║  📖 ELEMENT GUIDE  📖  ║</div>
                <div style="text-align: center; font-size: 16px; letter-spacing: 2px;">╚════════════════════════╝</div>

    <!-- Anti-throttling measures (web only - not needed in native app) -->
    <script>
        // Detect if running in Capacitor (native app) vs web browser
        const isNativeApp = window.Capacitor !== undefined;

        let wakeLock = null;

        // Wake Lock API - prevents browser from sleeping (web only, not needed in native)
        async function requestWakeLock() {
            // Skip wake lock in native app - not needed
            if (isNativeApp) {
                console.log('ℹ️ Running in native app - wake lock not needed');
                return;
            }

            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('✅ Wake Lock active (web) - page marked as important');

                    wakeLock.addEventListener('release', () => {
                        console.log('⚠️ Wake Lock released');
                    });
                }
            } catch (err) {
                console.log('Wake Lock not available:', err.message);
            }
        }

        // Request wake lock when page loads (web only)
        if (!isNativeApp) {
            requestWakeLock();

            // Re-request wake lock when tab becomes visible again
            document.addEventListener('visibilitychange', async () => {
                if (document.hidden) {
                    console.warn('⚠️ Tab hidden - Chrome may throttle performance');
                } else {
                    console.log('✅ Tab visible - restoring performance');
                    // Re-acquire wake lock if it was released
                    if (wakeLock !== null && wakeLock.released) {
                        await requestWakeLock();
                    }
                }
            });
        }

        // 2. Mystical ambient soundscape with chord progression & Fibonacci melody
        let audioContext = null;
        let oscillators = [];
        let melodyOscillators = [];
        let chordGain = null;
        let melodyGain = null;
        let playChord = null;
        let chordProgression = null;
        let currentChordIndex = 0;

        function setupAmbientDrone() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();

                // Safari/iOS: Resume audio context (required for autoplay policy)
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        console.log('✅ Audio context resumed for Safari/iOS');
                    }).catch(err => {
                        console.log('❌ Failed to resume audio context:', err);
                    });
                }

                // Separate gain nodes for chord and melody
                chordGain = audioContext.createGain();
                melodyGain = audioContext.createGain();

                chordGain.gain.value = 0.025;  // Very subtle chord pad
                melodyGain.gain.value = 0.015; // Even more subtle melody

                // Mystical chord progression (bass raised one octave for subtlety)
                // Am9 -> Fmaj9 -> Cmaj9 -> G9 (magical, ethereal progression)
                chordProgression = [
                    [220.00, 164.81, 196.00, 246.94, 293.66],  // Am9 (A3, E3, G3, B3, D4) - bass up octave
                    [174.62, 130.81, 155.56, 196.00, 261.63],   // Fmaj9 (F3, C3, Eb3, G3, C4) - bass up octave
                    [261.63, 164.81, 196.00, 246.94, 329.63],  // Cmaj9 (C4, E3, G3, B3, E4) - bass up octave
                    [196.00, 146.83, 196.00, 246.94, 293.66]    // G9 (G3, D3, G3, B3, D4) - bass up octave
                ];

                currentChordIndex = 0;

                // Create oscillators for current chord
                playChord = function(chordFreqs) {
                    // Stop previous oscillators
                    oscillators.forEach(osc => {
                        try { osc.stop(); } catch(e) {}
                    });
                    oscillators = [];

                    // Don't create new oscillators if muted
                    if (isMuted) return;

                    // Create new chord
                    chordFreqs.forEach(freq => {
                        const osc = audioContext.createOscillator();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        osc.detune.value = (Math.random() - 0.5) * 3; // Slight chorus

                        osc.connect(chordGain);
                        osc.start();
                        oscillators.push(osc);
                    });
                };

                // Start with first chord
                playChord(chordProgression[0]);

                // Chord progression: change every 21 seconds (Fibonacci: 21)
                setInterval(() => {
                    currentChordIndex = (currentChordIndex + 1) % chordProgression.length;
                    playChord(chordProgression[currentChordIndex]);
                }, 21000);

                // TWO MELODY THEMES: Mystical & Mario-like

                // Theme 1: Mystical (A minor pentatonic)
                const melodyNotes1 = [440.00, 523.25, 587.33, 659.25, 783.99, 880.00]; // A4, C5, D5, E5, G5, A5
                const melodySequences1 = [
                    [0, 2, 4],        // A, D, G - ascending gentle
                    [5, 3, 1],        // A5, E, C - descending sparkle
                    [1, 3, 4, 3],     // C, E, G, E - ethereal pattern
                    [4, 2, 0],        // G, D, A - grounding descent
                ];

                // Theme 2: Mario-like (C major pentatonic, higher octave)
                const melodyNotes2 = [523.25, 659.25, 783.99, 1046.50, 1174.66]; // C5, E5, G5, C6, D6
                const melodySequences2 = [
                    [0, 0, 2, 1],     // C, C, G, E - bouncy start
                    [1, 2, 3],        // E, G, C6 - ascending jump
                    [3, 2, 1, 0],     // C6, G, E, C - descending run
                    [0, 2, 4, 3],     // C, G, D6, C6 - playful hop
                ];

                let sequenceIndex = 0;
                let currentTheme = 0; // 0 = mystical, 1 = mario

                function playMelodySequence() {
                    // Select theme-specific notes and sequences
                    const melodyNotes = currentTheme === 0 ? melodyNotes1 : melodyNotes2;
                    const melodySequences = currentTheme === 0 ? melodySequences1 : melodySequences2;

                    const sequence = melodySequences[sequenceIndex];
                    let delay = 0;

                    // Play each note in the sequence
                    sequence.forEach((noteIdx, i) => {
                        setTimeout(() => {
                            // Don't play if muted
                            if (isMuted) return;

                            // Stop previous melody note
                            melodyOscillators.forEach(osc => {
                                try { osc.stop(); } catch(e) {}
                            });
                            melodyOscillators = [];

                            // Create bell-like tone (fundamental + harmonics)
                            const fundamental = audioContext.createOscillator();
                            fundamental.type = 'sine';
                            fundamental.frequency.value = melodyNotes[noteIdx];

                            const harmonic2 = audioContext.createOscillator();
                            harmonic2.type = 'sine';
                            harmonic2.frequency.value = melodyNotes[noteIdx] * 2;

                            const harmonic3 = audioContext.createOscillator();
                            harmonic3.type = 'sine';
                            harmonic3.frequency.value = melodyNotes[noteIdx] * 3;

                            const harmonic2Gain = audioContext.createGain();
                            harmonic2Gain.gain.value = 0.2;
                            const harmonic3Gain = audioContext.createGain();
                            harmonic3Gain.gain.value = 0.1;

                            fundamental.connect(melodyGain);
                            harmonic2.connect(harmonic2Gain);
                            harmonic2Gain.connect(melodyGain);
                            harmonic3.connect(harmonic3Gain);
                            harmonic3Gain.connect(melodyGain);

                            const now = audioContext.currentTime;

                            // Quick attack, long decay (bell-like)
                            melodyGain.gain.setValueAtTime(0, now);
                            melodyGain.gain.linearRampToValueAtTime(0.02, now + 0.05);
                            melodyGain.gain.exponentialRampToValueAtTime(0.001, now + 3);

                            fundamental.start(now);
                            harmonic2.start(now);
                            harmonic3.start(now);

                            // Stop after decay
                            fundamental.stop(now + 3);
                            harmonic2.stop(now + 3);
                            harmonic3.stop(now + 3);

                            melodyOscillators.push(fundamental, harmonic2, harmonic3);
                        }, delay);

                        // Notes within sequence: 1.5-2 seconds apart
                        delay += 1500 + Math.random() * 500;
                    });

                    // Move to next sequence
                    sequenceIndex = (sequenceIndex + 1) % melodySequences.length;

                    // Switch theme when we complete all sequences in current theme
                    if (sequenceIndex === 0) {
                        currentTheme = (currentTheme + 1) % 2; // Toggle between 0 and 1
                        console.log(`🎵 Switching to ${currentTheme === 0 ? 'Mystical' : 'Mario'} theme`);
                    }

                    // LONG PAUSE between sequences: 8-13 seconds (Fibonacci numbers)
                    const pauseDurations = [8000, 13000, 21000];
                    const nextPause = pauseDurations[Math.floor(Math.random() * pauseDurations.length)];

                    melodyTimeout = setTimeout(playMelodySequence, delay + nextPause);
                }

                // Start first melody sequence after 8 seconds (let chord establish + build anticipation)
                setTimeout(playMelodySequence, 8000);

                // Connect to output
                chordGain.connect(audioContext.destination);
                melodyGain.connect(audioContext.destination);

                console.log('✨ Mystical soundscape active: chord progression + Fibonacci melody');
            } catch (err) {
                console.log('Audio context not available:', err.message);
            }
        }

        // Start audio context on first user interaction (required by browser policy)
        let audioStarted = false;
        let isMuted = false;
        let melodyTimeout = null; // Track melody timeout for proper muting
        function startAudioOnInteraction() {
            if (!audioStarted) {
                setupAmbientDrone();
                audioStarted = true;
                document.removeEventListener('click', startAudioOnInteraction);
                document.removeEventListener('touchstart', startAudioOnInteraction);
                document.removeEventListener('keydown', startAudioOnInteraction);
            }
        }
        document.addEventListener('click', startAudioOnInteraction);
        document.addEventListener('touchstart', startAudioOnInteraction); // Mobile support
        document.addEventListener('keydown', startAudioOnInteraction);

        // Mute button functionality
        document.addEventListener('DOMContentLoaded', () => {
            const muteBtn = document.getElementById('mute-btn');
            const muteIcon = document.getElementById('mute-icon');

            muteBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent triggering audio start

                if (!audioStarted) {
                    // Start audio if not started yet
                    setupAmbientDrone();
                    audioStarted = true;
                    return;
                }

                isMuted = !isMuted;

                if (isMuted) {
                    // Mute - stop all oscillators and set gains to 0
                    if (chordGain) chordGain.gain.value = 0;
                    if (melodyGain) melodyGain.gain.value = 0;

                    // Stop all currently playing oscillators
                    oscillators.forEach(osc => {
                        try { osc.stop(); } catch(e) {}
                    });
                    melodyOscillators.forEach(osc => {
                        try { osc.stop(); } catch(e) {}
                    });
                    oscillators = [];
                    melodyOscillators = [];

                    muteIcon.textContent = 'OFF';
                    muteBtn.classList.remove('active');
                } else {
                    // Unmute - restart chord progression
                    // Safari/iOS: Resume audio context if suspended
                    if (audioContext && audioContext.state === 'suspended') {
                        audioContext.resume();
                    }

                    if (chordGain) chordGain.gain.value = 0.025;
                    if (melodyGain) melodyGain.gain.value = 0.015;

                    // Restart the current chord
                    if (playChord && chordProgression) {
                        playChord(chordProgression[currentChordIndex]);
                    }

                    muteIcon.textContent = 'ON';
                    muteBtn.classList.add('active');
                }
            });

            // ── Menu Button → Go to MainMenuScene ──
            const settingsBtn = document.getElementById('settings-btn');
            
            settingsBtn.addEventListener('click', async () => {
                // Save current world state before going to menu
                if (window.__pixellenceScene && window.__pixellenceScene.worldSerializer) {
                    try {
                        await window.__pixellenceScene.worldSerializer.autoSave();
                    } catch (e) {
                        console.warn('Auto-save before menu failed:', e);
                    }
                }
                // Switch to MainMenuScene
                if (window.__pixelboxGame) {
                    window.__pixelboxGame.scene.start('MainMenuScene');
                }
            });

            // ── Settings Panel Wiring ──
            const settingsOverlay = document.getElementById('settings-overlay');
            const settingsClose = document.getElementById('settings-close');
            const fpsToggle = document.getElementById('fps-toggle');
            const buildToggle = document.getElementById('build-toggle');
            const statsDiv = document.getElementById('stats');
            const settingsVersion = document.getElementById('settings-version');
            const versionEl = document.getElementById('version');
            // Hide settings modal - deferred to double rAF to prevent iOS touch state corruption
            function hideSettingsModal() {
                if (settingsOverlay.style.display === 'none') return;
                settingsOverlay.style.pointerEvents = 'none';
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        settingsOverlay.style.display = 'none';
                        settingsOverlay.style.pointerEvents = '';
                        // Re-focus canvas for touch input
                        setTimeout(() => {
                            const canvas = document.querySelector('canvas');
                            if (canvas) canvas.focus();
                        }, 150);
                    });
                });
            }
            settingsClose.addEventListener('click', hideSettingsModal);
            settingsOverlay.addEventListener('click', (e) => {
                if (e.target === settingsOverlay) hideSettingsModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && settingsOverlay.style.display === 'flex') {
                    hideSettingsModal();
                }
            });

            // FPS toggle
            fpsToggle.addEventListener('click', () => {
                const showing = statsDiv.classList.toggle('visible');
                fpsToggle.textContent = showing ? 'ON' : 'OFF';
                if (showing) fpsToggle.classList.add('active');
                else fpsToggle.classList.remove('active');
            });

            // Build mode toggle
            buildToggle.addEventListener('click', () => {
                if (window.__pixellenceScene) {
                    const scene = window.__pixellenceScene;
                    scene.buildMode = !scene.buildMode;
                    if (!scene.buildMode && scene.playerX === null) {
                        scene.spawnPlayer();
                    }
                    scene.updateModeDisplay();
                    buildToggle.textContent = scene.buildMode ? 'ON' : 'OFF';
                    if (scene.buildMode) buildToggle.classList.add('active');
                    else buildToggle.classList.remove('active');
                }
            });
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (wakeLock !== null) {
                wakeLock.release();
            }
            oscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            melodyOscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            if (audioContext !== null) {
                audioContext.close();
            }
        });
    </script>
