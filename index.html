<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pixellence - Particle Aquarium</title>
    <link rel="icon" type="image/svg+xml" href="/pixelbox/assets/favicon-BjBwciEx.svg">
    <link rel="icon" type="image/x-icon" href="/pixelbox/assets/favicon-C52D-SD9.ico">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available; /* Safari fix for viewport height */
        }
        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            box-sizing: border-box;
            overflow: hidden;
            min-height: 0; /* Important: allows flex child to shrink below content size */
            padding: 5px; /* Small padding to ensure canvas doesn't touch edges */
        }
        #game-container canvas {
            max-width: 100%;
            max-height: 100%;
            width: auto !important;
            height: auto !important;
            object-fit: contain;
        }
        /* Element picker wrapper (v5.0.0) */
        #element-picker {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            align-self: stretch;
            margin: 3px;
            margin-bottom: max(3px, env(safe-area-inset-bottom));
        }
        #element-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px;
            border-radius: 0 0 3px 3px;
            backdrop-filter: blur(5px);
            max-width: 100vw;
            justify-content: flex-start;
            padding-bottom: calc(2px + env(safe-area-inset-bottom));
        }

        /* Separator styling - default (horizontal layout) */
        .element-separator {
            width: 2px;
            height: 32px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 1px;
            flex-shrink: 0;
        }

        /* Mobile Portrait: Multi-row layout */
        @media (max-width: 768px) and (orientation: portrait) {
            #element-picker {
                max-width: 95vw;
            }
            .element-separator {
                display: none; /* Hide separators on mobile portrait - they break layout when wrapping */
            }
        }

        /* Mobile Landscape: Side panel layout */
        @media (max-width: 900px) and (orientation: landscape) {
            body {
                display: flex;
                flex-direction: column;
            }
            #game-header {
                height: 26px;
                font-size: 10px;
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
            }
            #game-header .hdr-btn { width: 20px; height: 20px; font-size: 11px; }
            #game-container {
                flex: 1;
                height: auto;
                width: calc(100vw - 44px); /* Leave space for 32px buttons + 12px margins */
                min-height: 0;
            }
            #element-picker {
                position: fixed;
                right: 3px;
                top: 50%;
                transform: translateY(-50%);
                flex-direction: row;
                max-height: 95vh;
                margin-bottom: 0;
            }
            #element-selector {
                flex-direction: column;
                max-width: 44px;
                overflow-y: auto;
                border-radius: 0 3px 3px 0;
            }

            /* Rotate separators for vertical layout */
            .element-separator {
                width: 32px;
                height: 2px;
                margin: 2px 0;
            }
        }
        .element-btn {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .element-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .element-btn:active {
            transform: translateY(0px) scale(0.95);
        }
        .element-btn.active {
            border-width: 2px;
            border-color: #00ffff;  /* Bright cyan */
            box-shadow:
                0 0 15px rgba(0, 255, 255, 0.9),  /* Strong outer glow */
                0 0 8px rgba(0, 255, 255, 0.6),  /* Medium glow */
                inset 0 0 8px rgba(0, 255, 255, 0.4);  /* Inner glow */
            transform: scale(1.05);
            position: relative;
            z-index: 10;  /* Bring active button to front */
        }
        .keybind {
            position: absolute;
            bottom: 1px;
            right: 1px;
            font-size: 7px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            padding: 1px 2px;
            border-radius: 2px;
            line-height: 1;
            pointer-events: none;
            text-shadow: none;
        }
        /* Category filter button + popup (v5.1.0 pixel-art redesign) */
        #category-tabs {
            display: flex;
            padding: 2px 2px 0 2px;
            justify-content: flex-start;
            position: relative;
            align-self: flex-start;
        }
        #filter-btn {
            width: 32px;
            height: 28px;
            border: none;
            border-radius: 3px 3px 0 0;
            background: rgba(20, 20, 30, 0.85);
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            image-rendering: pixelated;
            /* Pixel-art box-shadow border */
            box-shadow:
                -2px 0 0 0 rgba(0, 255, 255, 0.25),
                 2px 0 0 0 rgba(0, 255, 255, 0.25),
                 0 -2px 0 0 rgba(0, 255, 255, 0.25);
            transition: background 0.15s, color 0.15s;
        }
        #filter-btn:hover, #filter-btn.active {
            background: rgba(0, 255, 255, 0.12);
            color: #00ffff;
        }
        #filter-btn.has-filter {
            color: #00ffff;
        }
        /* Pixel-art filter icon via box-shadows on a pseudo-element */
        #filter-btn .filter-icon {
            display: block;
            width: 12px;
            height: 12px;
            position: relative;
        }
        #filter-btn .filter-icon::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 2px; height: 2px;
            background: transparent;
            /* Pixel funnel shape using box-shadow pixels (2px grid) */
            box-shadow:
                0px 0px 0 0 currentColor,
                2px 0px 0 0 currentColor,
                4px 0px 0 0 currentColor,
                6px 0px 0 0 currentColor,
                8px 0px 0 0 currentColor,
                10px 0px 0 0 currentColor,
                2px 2px 0 0 currentColor,
                4px 2px 0 0 currentColor,
                6px 2px 0 0 currentColor,
                8px 2px 0 0 currentColor,
                4px 4px 0 0 currentColor,
                6px 4px 0 0 currentColor,
                4px 6px 0 0 currentColor,
                6px 6px 0 0 currentColor,
                4px 8px 0 0 currentColor,
                4px 10px 0 0 currentColor;
        }
        /* Filter popup */
        #filter-popup {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            margin-bottom: 4px;
            background: rgba(10, 10, 20, 0.95);
            padding: 6px;
            z-index: 2000;
            image-rendering: pixelated;
            /* Pixel-art border using box-shadow */
            box-shadow:
                -2px -2px 0 0 #00cccc,
                 2px -2px 0 0 #00cccc,
                -2px  2px 0 0 #00cccc,
                 2px  2px 0 0 #00cccc,
                 0   -2px 0 0 #006666,
                 0    2px 0 0 #006666,
                -2px  0   0 0 #006666,
                 2px  0   0 0 #006666,
                 0    0   6px 2px rgba(0, 0, 0, 0.5);
            min-width: 140px;
        }
        #filter-popup.open { display: block; }
        .filter-option {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.65);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            touch-action: manipulation;
            transition: background 0.1s;
            white-space: nowrap;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .filter-option:hover {
            background: rgba(0, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
        }
        .filter-option.checked {
            color: #00ffff;
        }
        .filter-option .px-checkbox {
            display: inline-block;
            width: 10px;
            height: 10px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            image-rendering: pixelated;
            position: relative;
        }
        .filter-option.checked .px-checkbox {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.15);
        }
        .filter-option.checked .px-checkbox::after {
            content: '';
            position: absolute;
            top: 1px; left: 1px;
            width: 6px; height: 6px;
            background: #00ffff;
            image-rendering: pixelated;
        }
        .filter-separator {
            height: 1px;
            background: rgba(0, 255, 255, 0.15);
            margin: 3px 0;
        }
        .filter-option .filter-cat-icon {
            font-size: 13px;
            width: 16px;
            text-align: center;
        }
        /* Landscape: popup opens to the left instead of above */
        @media (max-width: 900px) and (orientation: landscape) {
            #category-tabs {
                padding: 2px 0 2px 2px;
            }
            #filter-btn {
                border-radius: 3px 0 0 3px;
                box-shadow:
                    -2px 0 0 0 rgba(0, 255, 255, 0.25),
                     0 -2px 0 0 rgba(0, 255, 255, 0.25),
                     0  2px 0 0 rgba(0, 255, 255, 0.25);
            }
            #filter-popup {
                bottom: auto;
                top: 0;
                left: auto;
                right: 100%;
                margin-bottom: 0;
                margin-right: 4px;
            }
        }
        #global-tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.85);
            color: rgba(255, 255, 255, 0.9);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 10px;
            pointer-events: none;
            z-index: 10000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            min-width: 100px;
            max-width: 200px;
        }
        #tooltip-name {
            font-weight: 600;
            margin-bottom: 3px;
            font-size: 10px;
            color: rgba(0, 255, 255, 0.8);
            text-transform: uppercase;
        }
        #tooltip-props {
            color: rgba(255, 255, 255, 0.7);
            font-size: 9px;
            margin-bottom: 3px;
            line-height: 1.3;
            white-space: pre-line;
        }
        #tooltip-key {
            color: rgba(255, 200, 100, 0.8);
            font-size: 8px;
            font-weight: 500;
            padding-top: 3px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* ── Element Detail Popup (long-press) ── */
        #element-detail-popup {
            position: fixed;
            display: none;
            z-index: 20001;
            background: #1a1a2e;
            color: #e0e0e0;
            border: 2px solid #444;
            box-shadow:
                0 0 0 2px #1a1a2e,
                0 0 0 4px #333,
                0 4px 16px rgba(0, 0, 0, 0.7);
            padding: 10px 12px;
            min-width: 180px;
            max-width: 260px;
            font-family: 'Courier New', monospace;
            image-rendering: pixelated;
            pointer-events: none;
        }
        #element-detail-popup::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid #444;
        }
        #detail-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 2px solid #333;
        }
        #detail-icon {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        #detail-name {
            font-size: 13px;
            font-weight: 700;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #detail-props {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }
        .detail-prop-tag {
            font-size: 9px;
            padding: 2px 5px;
            background: #2a2a3e;
            border: 1px solid #555;
            color: #aaa;
            letter-spacing: 0.5px;
        }
        .detail-prop-tag.state-tag {
            color: #88ccff;
            border-color: #4488aa;
        }
        .detail-prop-tag.density-tag {
            color: #ffcc66;
            border-color: #aa8833;
        }
        #detail-desc {
            font-size: 10px;
            line-height: 1.5;
            color: #bbb;
            word-wrap: break-word;
        }
        #detail-desc .desc-bullet {
            color: #666;
            margin-right: 2px;
        }
        #detail-hint {
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px solid #333;
            font-size: 8px;
            color: #666;
            text-align: center;
            letter-spacing: 0.5px;
        }
        /* ── Game Header Bar ── */
        #game-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 32px;
            padding: 0 10px;
            padding-top: env(safe-area-inset-top, 0px);
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            z-index: 500;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-header .header-left,
        #game-header .header-center,
        #game-header .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #game-header .header-left { flex: 1; justify-content: flex-start; }
        #game-header .header-center { flex: 0 0 auto; }
        #game-header .header-right { flex: 1; justify-content: flex-end; }
        #game-header .hdr-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(218, 165, 32, 0.35);
            color: rgba(255, 255, 255, 0.8);
            width: 22px;
            height: 22px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            padding: 0;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, border-color 0.15s;
            touch-action: manipulation;
        }
        #game-header .hdr-btn:active {
            background: rgba(218, 165, 32, 0.25);
            border-color: rgba(218, 165, 32, 0.7);
        }
        /* Prevent header buttons from stealing focus from Phaser canvas */
        #game-header .hdr-btn:focus {
            outline: none;
        }
        #game-header .hdr-btn.recording {
            background: rgba(255, 50, 50, 0.35);
            border-color: rgba(255, 50, 50, 0.8);
            animation: record-pulse 1s ease-in-out infinite;
        }
        @keyframes record-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #game-header #season-display {
            font-size: 11px;
            letter-spacing: 0.5px;
            color: rgba(255, 220, 120, 0.9);
        }
        #game-header #speed-display {
            font-size: 10px;
            min-width: 36px;
            text-align: center;
            color: rgba(0, 255, 255, 0.85);
        }

        /* ── Settings Modal ── */
        #settings-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            animation: fadeIn 0.25s ease;
        }
        #settings-modal {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            border: 2px solid rgba(218, 165, 32, 0.5);
            border-radius: 4px;
            padding: 20px 24px;
            max-width: 320px;
            width: 85%;
            box-shadow: 0 0 24px rgba(218, 165, 32, 0.15), inset 0 0 12px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.25s ease;
            position: relative;
            font-family: 'Courier New', monospace;
        }
        #settings-modal h3 {
            margin: 0 0 16px 0;
            text-align: center;
            color: rgba(218, 165, 32, 0.9);
            font-size: 14px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(218, 165, 32, 0.3);
            padding-bottom: 10px;
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
        }
        .settings-row:last-child { border-bottom: none; }
        .settings-row label { flex: 1; cursor: pointer; }
        .settings-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(218, 165, 32, 0.3);
            color: rgba(255, 255, 255, 0.8);
            padding: 4px 12px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
        }
        .settings-toggle:active,
        .settings-toggle.active {
            background: rgba(218, 165, 32, 0.2);
            border-color: rgba(218, 165, 32, 0.6);
            color: rgba(218, 165, 32, 0.95);
        }
        .settings-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(218, 165, 32, 0.3);
            color: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            min-width: 90px;
        }
        .settings-select:focus {
            outline: none;
            border-color: rgba(218, 165, 32, 0.6);
        }
        .settings-select option {
            background: #1a1a2e;
            color: #fff;
        }
        #settings-close {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(218, 165, 32, 0.4);
            width: 24px; height: 24px;
            color: rgba(218, 165, 32, 0.8);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .settings-version {
            text-align: center;
            font-size: 8px;
            opacity: 0.35;
            margin-top: 12px;
        }

        /* ── Stats (minimal, hidden by default) ── */
        #stats {
            position: fixed;
            top: calc(36px + env(safe-area-inset-top, 0px));
            right: 8px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.25);
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-family: monospace;
            backdrop-filter: blur(3px);
            display: none;
            z-index: 499;
        }
        #stats.visible { display: block; }
        #profiler-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.9);
            padding: 12px;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            min-width: 320px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #0f0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        #profiler-panel h3 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #0ff;
            border-bottom: 1px solid #0f0;
            padding-bottom: 4px;
        }
        #profiler-panel .metric {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
            padding: 2px 4px;
            background: rgba(0, 255, 0, 0.05);
        }
        #profiler-panel .metric.warn {
            color: #ff0;
            background: rgba(255, 255, 0, 0.1);
        }
        #profiler-panel .metric.critical {
            color: #f00;
            background: rgba(255, 0, 0, 0.1);
        }
        #profiler-panel .metric-name {
            flex: 1;
        }
        #profiler-panel .metric-value {
            font-weight: bold;
            text-align: right;
        }
        #profiler-panel .section {
            margin-top: 10px;
        }
        #profiler-panel kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }

        /* Shared Animation Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Grimoire Modal */
        #grimoire-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            animation: fadeIn 0.3s ease;
        }

        #grimoire-modal {
            background: #000000;
            border: 3px solid #00ff00;
            border-radius: 0;
            padding: 24px;
            max-width: 800px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5), inset 0 0 10px rgba(0, 255, 0, 0.1);
            animation: slideUp 0.3s ease;
            position: relative;
            font-family: 'Courier New', monospace;

                    buildToggle.textContent = scene.buildMode ? 'ON' : 'OFF';
                    if (scene.buildMode) buildToggle.classList.add('active');
                    else buildToggle.classList.remove('active');
                }
            });

            // Biome selector
            const biomeSelect = document.getElementById('biome-select');
            biomeSelect.addEventListener('change', (e) => {
                if (window.__pixellenceScene && window.__pixellenceScene.backgroundGenerator) {
                    window.__pixellenceScene.backgroundGenerator.setBiome(e.target.value);
                }
            });

            // ── Save/Load Worlds ──
            const openWorldsModal = async () => {
                // Close settings overlay if open
                if (settingsOverlay.style.display === 'flex') {
                    settingsOverlay.style.display = 'none';
                }
                const scene = window.__pixellenceScene;
                if (!scene) return;
                const { default: saveLoadModal } = await import('/pixelbox/assets/SaveLoadModal-D11a4O99.js');
                saveLoadModal.show(scene, () => {
                    // After loading a world, sync biome dropdown
                    if (scene.backgroundGenerator) {
                        const select = document.getElementById('biome-select');
                        if (select) select.value = scene.backgroundGenerator.biome;
                    }
                });
            };

            // Header save button
            const worldsBtn = document.getElementById('worlds-btn');
            if (worldsBtn) {
                let worldsTouchHandled = false;
                worldsBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    worldsTouchHandled = true;
                    openWorldsModal();
                });
                worldsBtn.addEventListener('click', () => {
                    if (worldsTouchHandled) { worldsTouchHandled = false; return; }
                    openWorldsModal();
                });
            }

            // Settings panel worlds button (Save/Load)
            const worldsSettingsBtn = document.getElementById('worlds-settings-btn');
            if (worldsSettingsBtn) {
                worldsSettingsBtn.addEventListener('click', openWorldsModal);
            }

            // Settings panel main menu button
            const mainMenuBtn = document.getElementById('main-menu-btn');
            if (mainMenuBtn) {
                mainMenuBtn.addEventListener('click', goToMainMenu);
            }

            // ── Auto-save on page hide (mobile tab switch / app background) ──
            document.addEventListener('visibilitychange', async () => {
                if (document.hidden && window.__pixellenceScene) {
                    const scene = window.__pixellenceScene;
                    if (scene.worldSerializer && scene.sceneReady) {
                        try {
                            await scene.worldSerializer.autoSave();
                        } catch (e) {
                            console.warn('Visibility-change auto-save failed:', e);
                        }
                    }
                }
            });
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (wakeLock !== null) {
                wakeLock.release();
            }
            if (chordIntervalId) clearInterval(chordIntervalId);
            if (melodyTimeout) clearTimeout(melodyTimeout);
            stopAllOscillators();
            if (audioContext !== null && audioContext.state !== 'closed') {
                audioContext.close().catch(() => {});
            }
        });
    </script>
